name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: messenger_tests
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESSENGER_TEST_DB: Host=localhost;Port=5432;Database=messenger_tests;Username=messenger;Password=integration-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MessengerBackend.slnx
      - run: dotnet build MessengerBackend.slnx --no-restore --configuration Release
      - run: dotnet tool restore
      - name: Apply migrations before parallel integration tests
        run: dotnet ef database update --project src/Messenger.Infrastructure --startup-project src/Messenger.Api --configuration Release --no-build --connection "$MESSENGER_TEST_DB"
      - run: dotnet test MessengerBackend.slnx --no-build --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
