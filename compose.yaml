services:
  messenger-api:
    image: messenger-api
    build:
      context: .
      dockerfile: src/Messenger.Api/Dockerfile
    ports:
      - "${API_PORT}:8080"
    environment:
      # Local HTTP demo. For network deployment configure TLS and Secure cookies.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Session__Secure: ${SESSION_COOKIE_SECURE:-false}
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Зашифрованные байты вложений — в управляемом файловом хранилище.
      AttachmentStorage__RootPath: /app/storage
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  api-storage:

